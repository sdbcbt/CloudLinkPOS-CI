name: 收银客户端永久版本构建
run-name: 横屏收银 Windows+Android · ${{ inputs.source_sha }}
# 只构建横屏收银客户端（Windows 与 Android）；手持 POS 由 build-terminal-release.yml 独立派发和运行。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 已合并私库 main 的完整源码提交
        required: true
        type: string
      platform:
        description: 构建平台
        type: choice
        options: [all, windows, android, changed]
        default: all
      before_sha:
        description: 自动通知的私库推送前提交，手动选 all/windows/android 时留空
        default: ''
        type: string
permissions: {}
concurrency:
  group: pos-permanent-releases
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.repository == 'sdbcbt/CloudLinkPOS-CI' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/client-release.yml
    with:
      product: pos
      source_sha: ${{ inputs.source_sha }}
      before_sha: ${{ inputs.before_sha }}
      platform: ${{ inputs.platform }}
    secrets: inherit

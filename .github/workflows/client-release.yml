name: 客户端永久版本构建（共用）
# 横屏收银（build-pos-release.yml）与手持 POS（build-terminal-release.yml）各自独立派发、独立运行，
# 共用本工作流的规划、签名、构建、核验与发布步骤；product 决定只构建哪一个产品的平台。
on:
  workflow_call:
    inputs:
      product:
        description: 产品：pos（Windows+Android）或 terminal（手持 Android）
        required: true
        type: string
      source_sha:
        required: true
        type: string
      before_sha:
        default: ''
        type: string
      platform:
        default: changed
        type: string
permissions: {}
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
defaults:
  run:
    shell: bash
jobs:
  plan:
    if: github.repository == 'sdbcbt/CloudLinkPOS-CI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_platforms: ${{ steps.plan.outputs.has_platforms }}
    steps:
      - name: 核验派发者为通知机器人
        # 发布与检查只接受私库 Webhook → Cloudflare Worker 的通知机器人派发（2026-11-12 用户决定），
        # 任何人手动运行都在此处失败。重跑时 github.actor 仍为原派发者，可照常“Re-run all jobs”。
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          if [[ "$DISPATCH_ACTOR" != "cloudlinkpos-ci-notifier[bot]" ]]; then
            echo "::error::本工作流只接受通知机器人 cloudlinkpos-ci-notifier[bot] 派发，当前触发者：$DISPATCH_ACTOR。需要补发请合并私库 main 或通过通知 Worker 重试。"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: automation
          persist-credentials: false
      - name: 签发私库只读令牌
        id: auth
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sdbcbt
          repositories: CloudLinkPOS
          permission-contents: read
      - name: 静默读取已合并固定源码
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 automation/ci/pos-build.py checkout
      - name: 检测收银端改动并固定版本
        id: plan
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BEFORE_SHA: ${{ inputs.before_sha }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PRODUCT: ${{ inputs.product }}
        run: python3 automation/ci/pos-build.py plan
  build:
    needs: plan
    if: needs.plan.outputs.has_platforms == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      POS_RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: 签发私库只读令牌
        id: auth
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sdbcbt
          repositories: CloudLinkPOS
          permission-contents: read
      - name: 静默读取已合并固定源码
        env:
          SOURCE_TOKEN: ${{ steps.auth.outputs.token }}
        run: python automation/ci/pos-build.py checkout
      - name: 核对统一版本参数
        run: python automation/ci/pos-build.py prepare
      - name: 准备固定安卓正式签名
        # 收银机与手持终端共用同一把既有正式签名，不另建密钥。
        if: matrix.platform == 'android' || matrix.platform == 'terminal-android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 automation/ci/pos-build.py signing
      - name: 下载固定 Windows Flutter SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          Invoke-WebRequest 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '88da00194893bf9543fc47c0bf31e6de978d49ffdb9c2f6e30c46dde0116c768') { throw 'Flutter SDK 摘要不匹配' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/flutter/bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: 判定手持安卓工具链
        # 仅终端矩阵：固定源码同时声明 terminal-android/toolchain.json 与 build_terminal_android.py 时为 api22，
        # 否则为 default（旧固定源码继续使用 3.44）。只输出固定模式，不输出私库清单内容。
        if: matrix.platform == 'terminal-android'
        id: toolchain
        run: python3 automation/ci/pos-build.py toolchain
      - name: 准备安卓固定工具链
        if: matrix.platform == 'android' || (matrix.platform == 'terminal-android' && steps.toolchain.outputs.mode == 'default')
        shell: bash
        run: |
          set -euo pipefail
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "e1ec95e6c550458a34de93580cb85dac24da0e9bedb9bb42811f050ac5a0c7d5  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 准备手持 API 22 隔离工具链
        # 官方 Flutter 归档按公开 CI 固定 SHA-256 校验后解压到独立目录，NDK 经 sdkmanager 官方仓库安装；
        # 横屏收银 Windows/Android 不进入本步骤。
        if: matrix.platform == 'terminal-android' && steps.toolchain.outputs.mode == 'api22'
        shell: bash
        run: |
          set -euo pipefail
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          JAVA_HOME="$JAVA_HOME_17_X64" python3 automation/ci/pos-build.py terminal-toolchain
      - name: 静默运行打包边界与软件版本测试
        run: python automation/ci/pos-build.py test
      - name: 静默构建 Windows 安装包和便携包
        if: matrix.platform == 'windows'
        env:
          POS_UPGRADE_PUBLIC_KEY: ${{ vars.POS_UPGRADE_PUBLIC_KEY }}
          POS_UPGRADE_PERMIT_PUBLIC_KEY: ${{ vars.POS_UPGRADE_PERMIT_PUBLIC_KEY }}
          POS_RELEASE_SIGNING_KEY: ${{ secrets.POS_RELEASE_SIGNING_KEY }}
          POS_WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.POS_WINDOWS_CODESIGN_PFX_BASE64 }}
          POS_WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.POS_WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          python automation/ci/pos-build.py windows
          python automation/ci/pos-build.py installer
      - name: 准备安卓签名清单 Go 工具链
        if: matrix.platform == 'android'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: 静默构建并核验固定正式签名安卓安装包
        if: matrix.platform == 'android'
        env:
          POS_UPGRADE_PUBLIC_KEY: ${{ vars.POS_UPGRADE_PUBLIC_KEY }}
          POS_UPGRADE_PERMIT_PUBLIC_KEY: ${{ vars.POS_UPGRADE_PERMIT_PUBLIC_KEY }}
          POS_RELEASE_SIGNING_KEY: ${{ secrets.POS_RELEASE_SIGNING_KEY }}
        run: python3 automation/ci/pos-build.py android
      - name: 静默构建并核验手持刷卡终端安装包
        # 首期只交付安装包：不传升级信任公钥与发布私钥，不生成 OTA 附件。
        if: matrix.platform == 'terminal-android'
        run: python3 automation/ci/pos-build.py terminal-android
      - name: 生成源码版本清单和 SHA-256
        run: python automation/ci/pos-build.py package
      - name: 核验并发布公开永久下载附件
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python automation/ci/pos-build.py publish
      - name: 清理安卓签名临时文件
        if: always() && (matrix.platform == 'android' || matrix.platform == 'terminal-android')
        run: python3 automation/ci/pos-build.py cleanup
      - name: 检查私有失败日志
        if: failure()
        id: failure_log
        run: python automation/ci/report-pos-failure.py exists
      - name: 签发失败详情专用检查令牌
        if: failure() && steps.failure_log.outputs.exists == 'true'
        id: failure_auth
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sdbcbt
          repositories: CloudLinkPOS
          permission-contents: read
          permission-checks: write
      - name: 将失败详情仅回写私库
        if: failure() && steps.failure_log.outputs.exists == 'true' && steps.failure_auth.outcome == 'success'
        env:
          CHECKS_TOKEN: ${{ steps.failure_auth.outputs.token }}
          SOURCE_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python automation/ci/report-pos-failure.py

name: 私库主线变更构建
on:
  workflow_dispatch:
    inputs:
      before:
        description: 私库 main 推送前的完整提交
        required: true
        type: string
      after:
        description: 私库 main 推送后的完整提交
        required: true
        type: string
permissions: {}
jobs:
  build:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/full-version-build.yml
    with:
      source_sha: ${{ inputs.after }}
      before_sha: ${{ inputs.before }}
      services: changed
      publish_receipts: true
    secrets: inherit

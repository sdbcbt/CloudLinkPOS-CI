name: 私库主线变更构建
on:
  workflow_dispatch:
    inputs:
      before:
        description: 私库 main 推送前的完整提交
        required: true
        type: string
      after:
        description: 私库 main 推送后的完整提交
        required: true
        type: string
      services:
        description: 默认 changed（按前后提交识别受影响服务）；补建个别失败服务时填逗号分隔的服务名，例如 inventory-rpc,iot-rpc
        required: false
        default: changed
        type: string
permissions: {}
jobs:
  build:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/full-version-build.yml
    with:
      source_sha: ${{ inputs.after }}
      before_sha: ${{ inputs.before }}
      services: ${{ inputs.services || 'changed' }}
      publish_receipts: true
    secrets: inherit
